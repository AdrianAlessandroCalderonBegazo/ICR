version: "3.8"

services:
  db:
    image: postgres:16
    container_name: icr_cms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: icr_cms
      POSTGRES_USER: icr_cms_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - icr_cms_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql:ro
    networks:
      - icr_cms_internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: icr_cms_backend
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: icr_cms_app
      PGPASSWORD: ${DB_PASSWORD:-changeme}
      PGDATABASE: icr_cms
      PORT: 4100
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el .env antes de desplegar}
      ALLOWED_ORIGIN: https://${SITE_DOMAIN:-inversionesicr.com}
    depends_on:
      - db
    networks:
      - icr_cms_internal
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.icr-cms.rule=Host(`${CMS_DOMAIN:-cms.inversionesicr.com}`)"
      - "traefik.http.routers.icr-cms.entrypoints=websecure"
      - "traefik.http.routers.icr-cms.tls.certresolver=letsencrypt"
      - "traefik.http.services.icr-cms.loadbalancer.server.port=4100"

volumes:
  icr_cms_data:

networks:
  icr_cms_internal:
  traefik_public:
    external: true
    # Debe coincidir con el nombre de la red externa que ya usa Traefik en el VPS.
    # Deliberadamente NO comparte contenedor ni volumen de Postgres con
    # icr-almacen-mvp: un incidente o migración en un sistema no debe poder
    # afectar al otro.
