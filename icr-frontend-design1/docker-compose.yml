version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: icr_frontend_web
    restart: unless-stopped
    environment:
      PORT: 5173
      NODE_ENV: production
    networks:
      - traefik_public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.icr-frontend.rule=Host(`${SITE_DOMAIN:-inversionesicr.com}`)"
      - "traefik.http.routers.icr-frontend.entrypoints=websecure"
      - "traefik.http.routers.icr-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.icr-frontend.loadbalancer.server.port=5173"

networks:
  traefik_public:
    external: true
    # Debe coincidir con el nombre de la red externa que ya usa Traefik en el
    # VPS (la misma que icr-almacen-mvp e icr-cms-mvp).
