<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/images/logo/logoICR.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Inversiones ICR — Energía confiable, soluciones inteligentes." />
    <title>ICR | Energía confiable, soluciones inteligentes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- Los correos de invitación/recuperación de Netlify Identity (el login
         del panel de contenido en /admin) redirigen a la raíz del sitio con
         un token en la URL. Este script debe estar aquí, no solo en /admin,
         para capturar ese token y abrir el diálogo de "crear contraseña". -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", (user) => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
  </body>
</html>
