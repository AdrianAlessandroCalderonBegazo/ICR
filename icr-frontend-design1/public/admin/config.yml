backend:
  # Sin Netlify: el backend real de producción es GitHub directo, que exige
  # una app OAuth propia (registrada en GitHub) y un pequeño proxy que haga
  # el intercambio del código por el token — ver la sección "Producción" de
  # CMS.md antes de desplegar. Mientras ese proxy no exista, este backend no
  # es alcanzable, pero no bloquea nada: local_backend (abajo) lo evita por
  # completo durante el desarrollo.
  name: github
  repo: AdrianAlessandroCalderonBegazo/ICR
  branch: main

# Con esto en true, Decap CMS detecta que corre en localhost/127.0.0.1 y
# habla con el servidor local (`npx decap-server`, puerto 8081) en vez del
# backend de arriba — así se edita contenido en local sin GitHub, sin OAuth
# y sin ningún servicio externo. En producción (dominio real) se ignora
# solo, y ahí sí se usa el backend "github" declarado arriba.
local_backend: true

# Decap CMS necesita rutas relativas a la RAÍZ del repositorio, no a esta
# carpeta del frontend — el repo tiene el sitio dentro de icr-frontend-design1/.
media_folder: "icr-frontend-design1/src/assets/images/uploads"
public_folder: "/src/assets/images/uploads"

collections:
  - name: "proyectos"
    label: "Proyectos (portafolio)"
    label_singular: "Proyecto"
    description: "Fichas que se muestran en /proyectos, filtrables por sector."
    folder: "icr-frontend-design1/src/content/projects"
    create: true
    slug: "{{fields.id}}"
    identifier_field: "title"
    summary: "{{title}} — {{sector}} ({{place}})"
    fields:
      - label: "ID"
        name: "id"
        widget: "string"
        hint: "Identificador único, sin espacios ni tildes (ej: mineria-moquegua). Define el nombre del archivo — no lo repitas en otra ficha, y no lo cambies después de creada la ficha."
      - label: "Sector"
        name: "sector"
        widget: "select"
        options:
          - { label: "Minería", value: "mineria" }
          - { label: "Industria", value: "industria" }
          - { label: "Hogares", value: "hogar" }
          - { label: "Municipios", value: "municipio" }
          - { label: "Agroindustria", value: "agro" }
          - { label: "Retail", value: "retail" }
      - label: "Lugar"
        name: "place"
        widget: "string"
        hint: "Ej: Arequipa"
      - label: "Título"
        name: "title"
        widget: "string"
      - label: "Descripción"
        name: "text"
        widget: "text"
      - label: "Métricas"
        name: "metrics"
        widget: "list"
        min: 1
        max: 4
        summary: "{{fields.value}} — {{fields.label}}"
        fields:
          - { label: "Valor", name: "value", widget: "string", hint: "Ej: 2.4 MW, −38%, 2024" }
          - { label: "Etiqueta", name: "label", widget: "string", hint: "Ej: Capacidad, Diésel, Año" }
      - label: "¿Es una ficha de ejemplo (placeholder)?"
        name: "placeholder"
        widget: "boolean"
        default: true
        hint: "Actívalo mientras los datos sean de ejemplo. Desactívalo al reemplazarlos por los del proyecto real — el sitio muestra un aviso mientras quede alguna ficha en true."
