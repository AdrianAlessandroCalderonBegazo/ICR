<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Inversiones ICR — Panel de contenido</title>
  </head>
  <body>
    <!-- Este panel es Decap CMS: un editor de contenido que no necesita
         backend propio. Guarda los cambios como commits sobre este
         repositorio de Git.

         En local (localhost/127.0.0.1) usa el servidor local
         (`npx decap-server`, ver CMS.md) gracias a local_backend: true en
         config.yml — no requiere login ni servicios externos.

         En producción usaría el backend "github" declarado en config.yml,
         que todavía necesita un proxy OAuth propio en el VPS — ver la
         sección "Producción" de CMS.md antes de desplegar. -->
    <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
  </body>
</html>
